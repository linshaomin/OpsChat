spring:
  application:
    name: OpsChat

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      agent:
        api-key: ${DASHSCOPE_API_KEY}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  port: ${SERVER_PORT:8080}

# OpsChat配置
opschat:
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        model: qwen-turbo
        timeout: 120000
        temperature: 0.7
        max-tokens: 2048

  session:
    expire-hours: 24
    max-window-size: 30
    max-tokens: 8192
    summary-threshold: 0.7

  rag:
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      collection: opschat_docs

  router:
    enabled: true
    llm-model: qwen-plus

  # 腾讯云日志服务配置
  qcloud:
    cls:
      enabled: ${QCLOUD_CLS_ENABLED:false}
      secret-id: ${QCLOUD_SECRET_ID}
      secret-key: ${QCLOUD_SECRET_KEY}
      region: ${QCLOUD_REGION:ap-beijing}
      default-topic-id: ${QCLOUD_CLS_TOPIC_ID}
      default-limit: 50
      timeout: 30

logging:
  level:
    com.opschat: DEBUG
    org.springframework.web: INFO